<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your Tarot Reading</title>
  <style>
    @font-face { font-family: 'Cinzel'; src: url('fonts/cinzel-400.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Fell'; src: url('fonts/fell-400.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'Fell'; font-style: italic; src: url('fonts/fell-400-italic.woff2') format('woff2'); font-display: swap; }
    :root { --gold: #e7c27d; --text: #eadcc0; --bg: #0b0710; --panel: #150e1c; --line: #3a2a48; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: radial-gradient(ellipse at top, #241433 0%, var(--bg) 60%) fixed, var(--bg);
      color: var(--text); font-family: 'Fell', Georgia, serif; font-size: 19px; line-height: 1.55;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 56px; }
    h1, .label, .heading { font-family: 'Cinzel', Georgia, serif; color: var(--gold); font-weight: 400; letter-spacing: 0.08em; }
    h1 { text-align: center; font-size: 26px; margin: 0 0 4px; }
    .who { text-align: center; font-style: italic; font-size: 22px; margin: 0; }
    .date { text-align: center; opacity: 0.6; margin: 0 0 24px; font-size: 16px; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
    .card { text-align: center; }
    .card img { width: 100%; border-radius: 6px; border: 1px solid var(--line); box-shadow: 0 0 18px rgba(231, 194, 125, 0.15); }
    .card img.reversed { transform: rotate(180deg); }
    .card .label { display: block; font-size: 12px; margin-top: 6px; }
    .card .name { font-size: 15px; line-height: 1.3; }
    .part { margin: 0 0 18px; }
    .heading { display: block; font-size: 13px; margin-bottom: 2px; }
    .divider { text-align: center; color: var(--gold); opacity: 0.7; margin: 26px 0; }
    .advice { font-style: italic; font-size: 24px; color: var(--gold); text-align: center; line-height: 1.35; margin: 22px 0; }
    .closing { font-style: italic; text-align: center; }
    .token { border: 1px solid var(--gold); border-radius: 10px; padding: 18px 16px; text-align: center; background: var(--panel); margin-top: 28px; }
    .token .heading { margin-bottom: 8px; }
    .token .thing { font-style: italic; font-size: 24px; color: var(--gold); }
    .token .said { margin: 10px 0 0; font-size: 17px; opacity: 0.85; }
    footer { text-align: center; opacity: 0.5; font-size: 14px; margin-top: 36px; }
    .error { text-align: center; margin-top: 30vh; }
  </style>
</head>
<body>
  <main id="page"></main>
  <script type="module">
    import { unpackReading } from './unpack.js';
    import { CARDS } from './cards.js';

    const LABELS = { PAST: 'Past', PRESENT: 'Present', FUTURE: 'Future' };
    const page = document.getElementById('page');
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    };

    const reading = await unpackReading(location.hash.slice(1));
    if (!reading) {
      page.append(el('p', 'error', 'This reading could not be found. Scan the QR code on your receipt again.'));
    } else {
      document.title = reading.name ? `${reading.name}'s Tarot Reading` : 'Your Tarot Reading';
      page.append(el('h1', '', 'Your Fate, Revealed'));
      page.append(el('p', 'who', reading.name || 'A Nameless Soul'));
      if (reading.date) page.append(el('p', 'date', new Date(reading.date).toLocaleDateString('en-GB', { dateStyle: 'long' })));

      const cards = el('div', 'cards');
      reading.cards.forEach((c, i) => {
        const card = CARDS[c.cardId];
        const position = ['PAST', 'PRESENT', 'FUTURE'][i];
        const box = el('div', 'card');
        const img = el('img', c.reversed ? 'reversed' : '');
        img.src = `images/${card.img}`;
        img.alt = card.name;
        box.append(img, el('span', 'label', LABELS[position]), el('div', 'name', `${card.name}${c.reversed ? ' (reversed)' : ''}`));
        cards.append(box);
      });
      page.append(cards);

      if (reading.sections.INTRO) page.append(el('p', 'part', reading.sections.INTRO));
      for (const position of ['PAST', 'PRESENT', 'FUTURE']) {
        const text = reading.sections[position];
        if (!text) continue;
        const p = el('p', 'part');
        p.append(el('span', 'heading', LABELS[position]), document.createTextNode(text));
        page.append(p);
      }
      page.append(el('div', 'divider', '✦'));
      if (reading.story) page.append(el('p', 'part', reading.story));
      if (reading.prophecy) page.append(el('p', 'advice', reading.prophecy));
      if (reading.closing) page.append(el('p', 'closing', reading.closing));

      if (reading.token || reading.luckyNumber) {
        const token = el('div', 'token');
        token.append(el('span', 'heading', 'A small token from me'));
        if (reading.token) token.append(el('div', 'thing', reading.token));
        if (reading.luckyNumber) token.append(el('p', 'said', `Lucky number ${reading.luckyNumber}`));
        page.append(token);
      }
      page.append(el('footer', '', 'Gangverk Halloween · The cards never lie'));
    }
  </script>
</body>
</html>
